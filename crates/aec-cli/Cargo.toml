[package]
name = "aec-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line interface and APM package manager for AEC"

[[bin]]
name = "aec"
path = "src/main.rs"

[[bin]]
name = "apm"
path = "src/bin/apm.rs"

[dependencies]
aec-ast = { version = "0.1.0", path = "../aec-ast" }
aec-parser = { version = "0.1.0", path = "../aec-parser" }
aec-check = { version = "0.1.0", path = "../aec-check" }
aec-runtime = { version = "0.1.0", path = "../aec-runtime" }
aec-ui = { version = "0.1.0", path = "../aec-ui" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
