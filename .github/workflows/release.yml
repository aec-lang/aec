name: AEC Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: aec-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev bubblewrap
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test diagnostics
        if: failure()
        shell: bash
        run: bash scripts/ci-diagnose.sh || true
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint diagnostics
        if: failure()
        shell: bash
        run: bash scripts/ci-clippy.sh || true
      - name: Build release binaries
        run: cargo build --release -p aec-cli --locked
      - name: Package workspace
        run: cargo package --workspace --no-verify --locked
      - name: CLI smoke tests
        run: |
          cargo run --release -p aec-cli --bin aec -- check examples/modules/main.aec
          cargo run --release -p aec-cli --bin aec -- check examples/nominal.aec
          cargo run --release -p aec-cli --bin aec -- run examples/nominal.aec --cli
          cargo run --release -p aec-cli --bin apm -- --help
      - name: Package Unix release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cp target/release/aec dist/aec-linux-x86_64
            cp target/release/apm dist/apm-linux-x86_64
            chmod +x dist/aec-linux-x86_64 dist/apm-linux-x86_64
            tar -czf dist/aec-linux-x86_64.tar.gz -C dist aec-linux-x86_64 apm-linux-x86_64
          else
            cp target/release/aec dist/aec-macos-x86_64
            cp target/release/apm dist/apm-macos-x86_64
            chmod +x dist/aec-macos-x86_64 dist/apm-macos-x86_64
            tar -czf dist/aec-macos-x86_64.tar.gz -C dist aec-macos-x86_64 apm-macos-x86_64
          fi
      - name: Package Windows release binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/aec.exe dist/aec-windows-x86_64.exe
          Copy-Item target/release/apm.exe dist/apm-windows-x86_64.exe
          Compress-Archive -Path dist/aec-windows-x86_64.exe,dist/apm-windows-x86_64.exe -DestinationPath dist/aec-windows-x86_64.zip
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: aec-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Sign release artifacts (only when GPG_RELEASE_KEY secret exists)
        # The `secrets` context is not usable inside `if:` conditions, so the
        # presence check happens in the shell through a mapped environment
        # variable instead. Without the secret this step is a documented no-op:
        # SHA256SUMS alone still verifies downloads end to end.
        env:
          AEC_GPG_KEY_B64: ${{ secrets.GPG_RELEASE_KEY }}
          AEC_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          AEC_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AEC_GPG_KEY_B64:-}" ]]; then
            echo "GPG_RELEASE_KEY not configured; publishing SHA256SUMS-only release."
            exit 0
          fi
          printf '%s' "$AEC_GPG_KEY_B64" | base64 --decode | gpg --batch --import
          cd release
          for f in *.tar.gz *.zip; do
            if [[ -n "${AEC_GPG_KEY_ID:-}" ]]; then
              gpg --batch --yes --passphrase "${AEC_GPG_PASSPHRASE:-}" --pinentry-mode loopback \
                --local-user "$AEC_GPG_KEY_ID" --detach-sign --armor --output "${f}.asc" "$f"
            else
              gpg --batch --yes --passphrase "${AEC_GPG_PASSPHRASE:-}" --pinentry-mode loopback \
                --detach-sign --armor --output "${f}.asc" "$f"
            fi
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AEC ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
            release/*.asc
