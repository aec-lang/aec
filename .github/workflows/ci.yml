name: AEC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build release binary
        run: cargo build --release -p aec-cli --locked
      - name: Package workspace
        run: cargo package --workspace --no-verify --locked
      - name: CLI smoke test
        run: cargo run --release -p aec-cli --bin aec -- check examples/modules/main.aec
      - name: APM smoke test
        run: cargo run --release -p aec-cli --bin apm -- --help
