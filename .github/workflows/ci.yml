name: AEC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev bubblewrap
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build release binary
        run: cargo build --release -p aec-cli --locked
      - name: Package workspace
        run: cargo package --workspace --no-verify --locked
      - name: CLI smoke test
        run: cargo run --release -p aec-cli --bin aec -- check examples/modules/main.aec
      - name: Nominal type smoke test
        run: cargo run --release -p aec-cli --bin aec -- check examples/nominal.aec
      - name: Nominal runtime smoke test
        run: cargo run --release -p aec-cli --bin aec -- run examples/nominal.aec --cli
      - name: Linux OS sandbox smoke test
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 runner images restrict unprivileged user namespaces,
          # which bubblewrap requires; restore the 22.04 behavior. Harmless
          # where the sysctl key does not exist.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          scripts/sandbox-linux.sh "$PWD/target/release/aec" check "$PWD/examples/nominal.aec"
      - name: APM smoke test
        run: cargo run --release -p aec-cli --bin apm -- --help
      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "### CI diagnostics — ${{ runner.os }}"
            echo '```'
            rustc --version
            cargo check --workspace --locked 2>&1 | tail -30 || true
            cargo test --workspace --locked --no-fail-fast 2>&1 | grep -E "test result:|panicked at|FAILED|failures:" -A 4 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
