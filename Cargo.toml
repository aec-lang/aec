[workspace]
resolver = "2"
members = [
    "crates/aec-ast",
    "crates/aec-parser",
    "crates/aec-runtime",
    "crates/aec-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Mohammad-Mahdi Alavi (Mmmadi) <mmadi@aec-lang.org>"]
rust-version = "1.75"

[workspace.dependencies]
pest = "2.7"
pest_derive = "2.7"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
pretty_assertions = "1.4"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde_json = "1.0"
