[workspace]
resolver = "2"
members = [
    "crates/aec-ast",
    "crates/aec-parser",
    "crates/aec-check",
    "crates/aec-runtime",
    "crates/aec-cli",
    "crates/aec-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Mohammad-Mahdi Alavi (Mmmadi) <mmadi@aec-lang.org>"]
rust-version = "1.75"

[workspace.dependencies]
pest = "2.7"
pest_derive = "2.7"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
pretty_assertions = "1.4"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde_json = "1.0"
regex = "1.10"
md5 = "0.7"
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
egui = "0.29"
eframe = "0.29"
